{% extends "layouts/base.html" %}

{% block title %} Toolbox {% endblock %}

{% block content %}
<style>
.file-input-container {
    width: calc(100% - 2 * 24px);
    padding: 24px;
    border-radius: 12px;

    color: #262631;
    background-color: #e9e9e9;
    border: solid 1px #ccc;

    text-align: center;
    font-size: 18px;
    letter-spacing: 0.25px;

    transition: background-color ease 0.2s,border-color ease 0.2s, color ease 0.2s;
}
.file-input-container:hover {
    border-color: #eee;
    background-color: #eeeeee;
}
.file-input-container input {
  display: none;
}

#gutenberg-newline-download {
    padding: 6px 12px;
    border-radius: 10px;
    background-color: #79afec;
    color: #fff;
    border: none;
    cursor: pointer;

    transition: background-color ease 0.2s;
}
#gutenberg-newline-download:hover {
    background-color: #7abff8;
}

#gutenberg-newline-status {
    color: #888;
    margin-top: 8px;
    margin-bottom: 10px;

    letter-spacing: 0.8px;
    font-size: 13px;
}
</style>

<article>
    <div
        style="display: flex; flex-direction: row; font-weight: 400; font-size: 0.95em; color: var(--soft-grey-2); padding: 6px 0;"
    >
        <div style="margin-right: 6px;">Toolbox</div>

        <!--
        TODO: if I have enough tools, having tags + a search bar could be handy
        <a href="/tags" class="grey-link" style="margin-left: auto;">search tags</a>
        -->
    </div>

    <!-- TODO: this is a bit messy; please clean this up when adding the next tool to the toolbox! -->
    <section id="gutenberg-newline" name="gutenberg-newline" style="background-color: #fff; color: var(--back-darker); border-radius: 8px; padding: 12px;">
        <div style="display: flex; flex-direction: row; align-items: center; margin-bottom: 8px;">
            <h3 style="margin: 0; color: var(--back-darker);">Gutenberg Newline</h3>
            <button id="gutenberg-newline-download" onclick="gutenbergNewlineDownloadResult()" style="margin-left: auto; display: none;">Download</button>
        </div>

        <label
            for="gutenberg-newline-file-input"    
            id="gutenberg-newline-file-input-container"
            class="file-input-container"
            style="display: flex; flex-direction: row; align-items: center; justify-content: center; margin-bottom: 8px; cursor: pointer;"
        >
            <img src="/icons/tray-arrow-up.svg" role="img" style="width: 32px; margin-right: 8px;" />
            <span>Upload a .txt file</span>
            <input
                type="file"
                id="gutenberg-newline-file-input"
                text="Upload a .txt file"
                multiple
            />
        </label>

        <div style="display: flex; gap: 8px; justify-content: center;">
            <div id="gutenberg-newline-status" style="display: none;">

            </div>
            
        </div>

        <p style="margin: 0;">
            This tool removes newlines between contiguous lines of content from texts. For examples, see works published
            in .txt form by <a style="color: #4690e4;" href="https://www.gutenberg.org/">project gutenberg</a>. 
        </p>
    </section>
</article>

<script>
    // TODO: use one class per widget

    var gutenbergNewlineResultText = null;
    var gutenbergNewlineResultFilename = null;

    function normalizeLinebreak(text) {
        return text.replaceAll("\r\n", "\n");
    }

    /// @brief we assume lines may be \n or \r\n terminated
    function removeNewlines(text) {
        result = ""
        lastLine = ""
        for (
            const line
            of text.split("\n")
        ) {
            if (line.trim() !== "" && lastLine.trim() !== "") {
                result += " "
            } else {
                result += "\n"
            }

            result += line
            lastLine = line
        }

        return result
    }
     
    function getTextFromFile(file, reader) {
        let p = new Promise((resolve, reject) => {
            reader.onload = (e) => {
                console.log(e)
                console.log(e.target)
                console.log(e.target.result)
                resolve(e.target.result)
            }
            reader.onerror = (e) => {
                // TODO: display / handle error
            }
        })
        reader.readAsText(file, 'UTF-8');
        return p
    }

    async function processFile(name, text) {
        if ((name !== null) && !name.endsWith(".txt")) {
            throw new Error("invalid file name")
        }

        document.getElementById("gutenberg-newline-status").innerText = `loading ${name}...`
        document.getElementById("gutenberg-newline-status").style.display = "block";

        if (typeof text == "string") {
            
        } else if (text instanceof File) {
            const reader = new FileReader();
            text = await getTextFromFile(text, reader)
            console.log(text)
        }
        resultText = normalizeLinebreak(text)
        console.log(resultText.split("\n"))

        let numLines = 1;
        let numCharacters = 0;
        for (const c of resultText) {
            if (c === "\n") {
                numLines += 1;
            }
            numCharacters += 1;
        }

        document.getElementById("gutenberg-newline-status").innerText = `\`${name}\`: ${numLines} lines, ${numCharacters} characters`

        resultText = removeNewlines(resultText)
        console.log(resultText)
        return resultText
    }

    // TODO: this!
    function download(content, filename, contentType) {
        if (!contentType)
            contentType = 'application/octet-stream';
        
        console.log("downloading...")

        var a = document.createElement('a');
        var blob = new Blob([content], {'type':contentType});
        a.href = window.URL.createObjectURL(blob);
        a.download = filename;
        a.click();
    }

    const gutenbergNewlineFileInput = document.getElementById("gutenberg-newline-file-input");
    gutenbergNewlineFileInput.addEventListener("change", gutenbergNewlineHandleFiles);

    async function gutenbergNewlineHandleFiles() {
        // TODO: are files uploaded webpage wide?
        const fileList = this.files;
        const numFiles = fileList.length;
        if (fileList.length == 0) {
            return
        } else if (fileList.length == 1) {
            const file = fileList[0];
            gutenbergNewlineResultText = await processFile(file.name, file);
            gutenbergNewlineResultFilename = "new_" + file.name;
            document.getElementById("gutenberg-newline-download").style.display = "inline";
            document.getElementById("gutenberg-newline-download").innerHTML = `Download \`${gutenbergNewlineResultFilename}\``;
            return
        } else {
            document.getElementById("gutenberg-newline-status").innerText = `multiple (${fileList.length}) files not supported`
            document.getElementById("gutenberg-newline-status").style.display = "block";
            document.getElementById("gutenberg-newline-status").style.color = "#d44";

            /*
            for (const file of fileList) {
                const resultText = await processFile(file.name, file);
            }
            */

            return
        }
    }
    function gutenbergNewlineDownloadResult() {
        if (gutenbergNewlineResultText != null) {
            download(gutenbergNewlineResultText, gutenbergNewlineResultFilename, "application/octet-stream");
        }
    }

    const input = document.getElementById("file");
    const nameEl = document.getElementById("file-name");

    input.addEventListener("change", () => {
        nameEl.textContent = input.files.length ? input.files[0].name : "Choose a file";
    });
</script>

{% endblock content %}
