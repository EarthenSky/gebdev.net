        <p style="margin: 0;">
            This tool removes newlines between contiguous lines of content from texts. For examples, see works published

<script>
    // TODO: use one class per widget

    var gutenbergNewlineResultText = null;
    var gutenbergNewlineResultFilename = null;

    function normalizeLinebreak(text) {
        return text.replaceAll("\r\n", "\n");
    }

    /// @brief we assume lines may be \n or \r\n terminated
    function removeNewlines(text) {
        result = ""
        lastLine = ""
        for (
            const line
            of text.split("\n")
        ) {
            if (line.trim() !== "" && lastLine.trim() !== "") {
                result += " "
            } else {
                result += "\n"
            }

            result += line
            lastLine = line
        }

        return result
    }
     
    function getTextFromFile(file, reader) {
        let p = new Promise((resolve, reject) => {
            reader.onload = (e) => {
                console.log(e)
                console.log(e.target)
                console.log(e.target.result)
                resolve(e.target.result)
            }
            reader.onerror = (e) => {
                // TODO: display / handle error
            }
        })
        reader.readAsText(file, 'UTF-8');
        return p
    }

    async function processFile(name, text) {
        if ((name !== null) && !name.endsWith(".txt")) {
            throw new Error("invalid file name")
        }

        document.getElementById("gutenberg-newline-status").innerText = `loading ${name}...`
        document.getElementById("gutenberg-newline-status").style.display = "block";

        if (typeof text == "string") {
            
        } else if (text instanceof File) {
            const reader = new FileReader();
            text = await getTextFromFile(text, reader)
            console.log(text)
        }
        resultText = normalizeLinebreak(text)
        console.log(resultText.split("\n"))

        let numLines = 1;
        let numCharacters = 0;
        for (const c of resultText) {
            if (c === "\n") {
                numLines += 1;
            }
            numCharacters += 1;
        }

        document.getElementById("gutenberg-newline-status").innerText = `\`${name}\`: ${numLines} lines, ${numCharacters} characters`

        resultText = removeNewlines(resultText)
        console.log(resultText)
        return resultText
    }

    // TODO: this!
    function download(content, filename, contentType) {
        if (!contentType)
            contentType = 'application/octet-stream';
        
        console.log("downloading...")

        var a = document.createElement('a');
        var blob = new Blob([content], {'type':contentType});
        a.href = window.URL.createObjectURL(blob);
        a.download = filename;
        a.click();
    }

    const gutenbergNewlineFileInput = document.getElementById("gutenberg-newline-file-input");
    gutenbergNewlineFileInput.addEventListener("change", gutenbergNewlineHandleFiles);

    async function gutenbergNewlineHandleFiles() {
        // TODO: are files uploaded webpage wide?
        const fileList = this.files;
        const numFiles = fileList.length;
        if (fileList.length == 0) {
            return
        } else if (fileList.length == 1) {
            const file = fileList[0];
            gutenbergNewlineResultText = await processFile(file.name, file);
            gutenbergNewlineResultFilename = "new_" + file.name;
            document.getElementById("gutenberg-newline-download").style.display = "inline";
            document.getElementById("gutenberg-newline-download").innerHTML = `Download \`${gutenbergNewlineResultFilename}\``;
            return
        } else {
            document.getElementById("gutenberg-newline-status").innerText = `multiple (${fileList.length}) files not supported`
            document.getElementById("gutenberg-newline-status").style.display = "block";
            document.getElementById("gutenberg-newline-status").style.color = "#d44";

            /*
            for (const file of fileList) {
                const resultText = await processFile(file.name, file);
            }
            */

            return
        }
    }
    function gutenbergNewlineDownloadResult() {
        if (gutenbergNewlineResultText != null) {
            download(gutenbergNewlineResultText, gutenbergNewlineResultFilename, "application/octet-stream");
        }
    }

    const input = document.getElementById("file");
    const nameEl = document.getElementById("file-name");

    input.addEventListener("change", () => {
        nameEl.textContent = input.files.length ? input.files[0].name : "Choose a file";
    });
</script>
